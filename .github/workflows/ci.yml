name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch attago-spec
        uses: actions/checkout@v4
        with:
          repository: AttaGo/attago-spec
          path: attago-spec

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Conformance tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ATTAGO_BASE_URL: ${{ secrets.ATTAGO_DEV_BASE_URL }}
          ATTAGO_API_KEY: ${{ secrets.ATTAGO_DEV_API_KEY }}
          ATTAGO_SPEC_DIR: ./attago-spec
        run: npm run test:conformance
