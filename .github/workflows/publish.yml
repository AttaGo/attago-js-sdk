name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

      - name: Check versions
        run: |
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"

      - name: Publish to npm
        run: npm publish --provenance --access public
